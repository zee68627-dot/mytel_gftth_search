<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTEL FTTH DATA</title>
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    
    <!-- Header Section -->
    <div class="border-b pb-4 mb-6 text-center">
      <p class="text-xs text-gray-500 font-semibold tracking-wide uppercase">Developed by Min Khant Zaw</p>
      <h1 class="text-2xl font-bold text-blue-900 mt-1">MYTEL FTTH DATA</h1>
      <h2 class="text-sm text-gray-600">Account / Station / VMY Search</h2>
    </div>

    <!-- Search Input Section -->
    <div class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Enter Account, Station Code or VMY Code..." 
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        onkeypress="if(event.key === 'Enter') handleSearch()"
      />
      <button 
        onclick="handleSearch()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition flex items-center gap-2 cursor-pointer"
      >
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </button>
    </div>

    <!-- Message / Status Area -->
    <div id="statusMessage" class="text-sm text-gray-500 mb-4 hidden"></div>

    <!-- Multi-Record Results Table -->
    <div id="tableContainer" class="overflow-x-auto mb-6 hidden">
      <table class="w-full text-sm text-left text-gray-700 border">
        <thead class="bg-gray-800 text-white uppercase text-xs">
          <tr>
            <th class="py-2.5 px-3">NO</th>
            <th class="py-2.5 px-3">ACCOUNT</th>
            <th class="py-2.5 px-3">SUBSCRIBER</th>
            <th class="py-2.5 px-3">STATION CODE</th>
            <th class="py-2.5 px-3">VMY CODE</th>
            <th class="py-2.5 px-3 text-center">ACTION</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- JS Table Rows -->
        </tbody>
      </table>
    </div>

    <!-- Selected Customer Detail Card -->
    <div id="detailCard" class="bg-blue-50 border border-blue-200 rounded-lg p-5 hidden">
      <h3 class="text-lg font-bold text-blue-900 border-b border-blue-200 pb-2 mb-4">Subscriber Details</h3>
      <div id="detailContent" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
        <!-- JS Details -->
      </div>
    </div>

  </div>

  <!-- Javascript Code -->
  <script>
    let searchResultsData = [];

    // Simple CSV Parser
    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n').filter(line => line.length > 0);
      if (lines.length <= 1) return [];

      const parseCSVLine = (text) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (c === '"') {
            inQuotes = !inQuotes;
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
      };

      const headers = parseCSVLine(lines[0]);
      const rows = lines.slice(1).map(parseCSVLine);

      return rows.map(row => {
        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = row[index] || '';
        });
        return obj;
      });
    }

    // Search Logic (Netlify Serverless Function)
    async function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const statusMsg = document.getElementById('statusMessage');
      const tableContainer = document.getElementById('tableContainer');
      const detailCard = document.getElementById('detailCard');

      if (!query) {
        alert('ကျေးဇူးပြု၍ ရှာဖွေလိုသော အချက်အလက် ရိုက်ထည့်ပါ');
        return;
      }

      statusMsg.classList.remove('hidden');
      statusMsg.innerText = 'Searching data...';
      tableContainer.classList.add('hidden');
      detailCard.classList.add('hidden');

      try {
        const response = await fetch(`/.netlify/functions/search?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('Search failed with status: ' + response.status);

        const csvText = await response.text();
        searchResultsData = parseCSV(csvText);

        if (searchResultsData.length === 0) {
          statusMsg.innerText = 'No records found for "' + query + '"';
          return;
        }

        statusMsg.innerText = `Found ${searchResultsData.length} record(s).`;
        
        if (searchResultsData.length === 1) {
          showDetails(0);
        } else {
          renderTable(searchResultsData);
        }
      } catch (err) {
        statusMsg.innerText = 'Connection error: ' + err.message;
      }
    }

    // Render Table for Multiple Results
    function renderTable(data) {
      const tableBody = document.getElementById('tableBody');
      const tableContainer = document.getElementById('tableContainer');
      tableBody.innerHTML = '';

      data.forEach((item, index) => {
        const row = `
          <tr class="border-b hover:bg-gray-100 bg-white">
            <td class="py-2.5 px-3">${index + 1}</td>
            <td class="py-2.5 px-3 font-semibold text-blue-800">${item.account || '-'}</td>
            <td class="py-2.5 px-3">${item.subscriber_name || '-'}</td>
            <td class="py-2.5 px-3">${item.station_code || '-'}</td>
            <td class="py-2.5 px-3">${item.VMY_Code || item.vmy_code || '-'}</td>
            <td class="py-2.5 px-3 text-center">
              <button onclick="showDetails(${index})" class="bg-blue-600 text-white hover:bg-blue-700 text-xs px-3 py-1 rounded font-medium transition">View</button>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });

      tableContainer.classList.remove('hidden');
    }

    // Show Detail View
    function showDetails(index) {
      const item = searchResultsData[index];
      const detailCard = document.getElementById('detailCard');
      const detailContent = document.getElementById('detailContent');

      // 1. Phone Call Helper
      const custPhone = item.custoemr_phone_number || item.customer_phone || '';
      const custPhoneHTML = custPhone 
        ? `<a href="tel:${custPhone}" class="text-blue-600 hover:underline font-semibold font-mono inline-flex items-center gap-1">📞 ${custPhone}</a>`
        : '-';

      const techName = item.technician_name || item.tech_name || item.technical_name || '-';

      const techPhone = item.technical_phone_number || item.tech_phone || item.technician_phone || '';

      const techPhoneHTML = techPhone
        ? `<a href="tel:${techPhone}" class="text-blue-600 hover:underline font-semibold font-mono inline-flex items-center gap-1">📞 ${techPhone}</a>`
        : '-'; 

      // 2. Lat/Long & Google Maps Link Helper
      let mapLinkHTML = '-';
      const latLongVal = item.lat_long || item.lat_lng || item.location || '';
      
      if (latLongVal) {
        const cleanCoords = latLongVal.replace(/\s+/g, '');
        mapLinkHTML = `<a href="https://www.google.com/maps/search/?api=1&query=${cleanCoords}" target="_blank" class="text-blue-600 hover:underline font-medium inline-flex items-center gap-1">📍 ${latLongVal}</a>`;
      } else if (item.latitude && item.longitude) {
        const coords = `${item.latitude},${item.longitude}`;
        mapLinkHTML = `<a href="https://www.google.com/maps/search/?api=1&query=${coords}" target="_blank" class="text-blue-600 hover:underline font-medium inline-flex items-center gap-1">📍 ${coords}</a>`;
      }

      detailContent.innerHTML = `
        <div><strong>Account:</strong> ${item.account || '-'}</div>
        <div><strong>Subscriber Name:</strong> ${item.subscriber_name || '-'}</div>
        <div><strong>Phone Number:</strong> ${custPhoneHTML}</div>
        <div><strong>Station Code:</strong> ${item.station_code || '-'}</div>
        <div><strong>Branch:</strong> ${item.branch || '-'}</div>
        <div><strong>Partner Name:</strong> ${item.partner_name || '-'}</div>
        
        <div class="col-span-1 md:col-span-2 border-t border-blue-200 pt-3 mt-2 font-bold text-blue-900">Technical Info</div>
        <div><strong>Device Code:</strong> ${item.device_code || '-'}</div>
        <div><strong>Port on Card:</strong> ${item.port_on_card || '-'}</div>
        <div><strong>Port Splitter:</strong> ${item.port_splitter || '-'}</div>
        <div><strong>Subscriber Node:</strong> ${item.subscriber_node || '-'}</div>
        <div><strong>Cable Length:</strong> ${item.cable_length ? item.cable_length : '-'}</div>
        <div><strong>ONT Serial:</strong> ${item.ont_serial || '-'}</div>
        <div><strong>VMY Code:</strong> ${item.VMY_Code || item.vmy_code || '-'}</div>
        <div><strong>Technician Name:</strong> ${techName}</div>
        <div><strong>Technical Phone:</strong> ${techPhoneHTML}</div>

        <div class="col-span-1 md:col-span-2 border-t border-blue-200 pt-3 mt-2 font-bold text-blue-900">Customer Info</div>
        <div class="col-span-1 md:col-span-2"><strong>Department:</strong> ${item.department || '-'}</div>
        <div class="col-span-1 md:col-span-2"><strong>Address:</strong> ${item.address || '-'}</div>
        <div class="col-span-1 md:col-span-2"><strong>Location (Map):</strong> ${mapLinkHTML}</div>
      `;

      detailCard.classList.remove('hidden');
    }
  </script>
</body>
</html>
