<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTEL FTTH DATA</title>
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    
    <!-- Header Section -->
    <div class="border-b pb-4 mb-6 text-center">
      <p class="text-xs text-gray-500 font-semibold tracking-wide uppercase">Developed by Min Khant Zaw</p>
      <h1 class="text-2xl font-bold text-blue-900 mt-1">MYTEL FTTH DATA</h1>
      <h2 class="text-sm text-gray-600">Account / Station / VMY Search</h2>
    </div>

    <!-- Search Input Section -->
    <div class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Enter Account, Station Code or VMY Code..." 
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        onkeypress="if(event.key === 'Enter') handleSearch()"
      />
      <button 
        onclick="handleSearch()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition flex items-center gap-2 cursor-pointer"
      >
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </button>
    </div>

    <!-- Message / Status Area -->
    <div id="statusMessage" class="text-sm text-gray-500 mb-4 hidden"></div>

    <!-- Container for Subscriber Detail Cards -->
    <div id="cardsContainer" class="flex flex-col gap-6">
      <!-- Dynamic Detail Cards Will Appear Here -->
    </div>

  </div>

  <!-- Javascript Code -->
  <script>
    let searchResultsData = [];

    // Simple CSV Parser
    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n').filter(line => line.length > 0);
      if (lines.length <= 1) return [];

      const parseCSVLine = (text) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (c === '"') {
            inQuotes = !inQuotes;
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
      };

      const headers = parseCSVLine(lines[0]);
      const rows = lines.slice(1).map(parseCSVLine);

      return rows.map(row => {
        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = row[index] || '';
        });
        return obj;
      });
    }

    // Search Logic (Netlify Serverless Function + Strict Client Filtering)
    async function handleSearch() {
      const queryInput = document.getElementById('searchInput');
      const query = queryInput ? queryInput.value.trim() : '';
      const statusMsg = document.getElementById('statusMessage');
      const cardsContainer = document.getElementById('cardsContainer');

      if (!query) {
        alert('ကျေးဇူးပြု၍ ရှာဖွေလိုသော အချက်အလက် ရိုက်ထည့်ပါ');
        return;
      }

      if (statusMsg) {
        statusMsg.classList.remove('hidden');
        statusMsg.innerText = 'Searching data...';
      }
      if (cardsContainer) cardsContainer.innerHTML = '';

      try {
        const response = await fetch(`/.netlify/functions/search?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('Search failed with status: ' + response.status);

        const csvText = await response.text();
        let rawData = parseCSV(csvText);

        // Address/Remark များတွင် ပါဝင်မှုကြောင့် မှားယွင်းမလာစေရန် Target Fields တွင်သာ Strict Filter လုပ်ခြင်း
        const lowerQuery = query.toLowerCase();
        const filteredResults = rawData.filter(item => {
          const acc = (item.account || item.Account || '').toLowerCase();
          const station = (item.station_code || item.Station_Code || '').toLowerCase();
          const vmy = (item.VMY_Code || item.vmy_code || '').toLowerCase();
          const phone = (item.custoemr_phone_number || item.customer_phone || '').toLowerCase();

          return acc.includes(lowerQuery) || 
                 station.includes(lowerQuery) || 
                 vmy.includes(lowerQuery) || 
                 phone.includes(lowerQuery);
        });

        if (filteredResults.length === 0) {
          if (statusMsg) statusMsg.innerText = 'No records found for "' + query + '"';
          return;
        }

        if (statusMsg) statusMsg.innerText = `Found ${filteredResults.length} record(s).`;
        renderDetailCards(filteredResults);

      } catch (err) {
        if (statusMsg) statusMsg.innerText = 'Connection error: ' + err.message;
      }
    }
    
      function renderDetailCards(data) {
      const cardsContainer = document.getElementById('cardsContainer');
      cardsContainer.innerHTML = '';

      data.forEach((item, index) => {
        // Customer Phone
        const custPhone = item.custoemr_phone_number || item.customer_phone || item.phone_number || '';
        const custPhoneHTML = custPhone 
          ? `<a href="tel:${custPhone}" class="text-blue-600 hover:underline font-semibold font-mono inline-flex items-center gap-1">📞 ${custPhone}</a>`
          : '-';

        // Technical Name Check
        const techName = item.technical_name || item.technician_name || item.tech_name || '-';
        
        // Technical Phone Check
        const techPhone = item.technical_phone_number || item.tech_phone || item.technician_phone || '';
        const techPhoneHTML = techPhone
          ? `<a href="tel:${techPhone}" class="text-blue-600 hover:underline font-semibold font-mono inline-flex items-center gap-1">📞 ${techPhone}</a>`
          : '-'; 

        // Address Field safely check (Case Insensitive)
        const fullAddress = String(item.address || item.Address || item.ADDRESS || '');

        // Location Parsing Logic
        let mapLinkHTML = '-';
        let foundCoords = '';

        // 1. Direct Lat/Long Fields
        if (item.lat_long || item.LAT_LONG) foundCoords = String(item.lat_long || item.LAT_LONG).trim();
        else if (item.lat_lng || item.LAT_LNG) foundCoords = String(item.lat_lng || item.LAT_LNG).trim();
        else if (item.location || item.LOCATION) foundCoords = String(item.location || item.LOCATION).trim();
        else if (item.latitude && item.longitude) foundCoords = `${item.latitude},${item.longitude}`;

        // 2. Extract Lat/Long from Address text if direct field is missing
        if (!foundCoords && fullAddress) {
          // Matches "16.812876, 96.170910" or "16.812876,96.170910"
          const match = fullAddress.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)/);
          if (match) {
            foundCoords = `${match[1]},${match[2]}`;
          }
        }

        // Render Map Link if coordinates found
        if (foundCoords && foundCoords !== '-') {
          const cleanCoords = foundCoords.replace(/\s+/g, '');
          mapLinkHTML = `<a href="https://www.google.com/maps/search/?api=1&query=${cleanCoords}" target="_blank" class="text-blue-600 hover:underline font-bold inline-flex items-center gap-1">📍 ${cleanCoords}</a>`;
        }

        const cardHTML = `
          <div class="bg-blue-50 border border-blue-200 rounded-lg p-5 shadow-sm">
            <h3 class="text-lg font-bold text-blue-900 border-b border-blue-200 pb-2 mb-4">
              Subscriber Details ${data.length > 1 ? `#${index + 1}` : ''}
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              <div><strong>Account:</strong> ${item.account || '-'}</div>
              <div><strong>Subscriber Name:</strong> ${item.subscriber_name || '-'}</div>
              <div><strong>Phone Number:</strong> ${custPhoneHTML}</div>
              <div><strong>Station Code:</strong> ${item.station_code || '-'}</div>
              <div><strong>Branch:</strong> ${item.branch || '-'}</div>
              <div><strong>Partner Name:</strong> ${item.partner_name || '-'}</div>
              
              <div class="col-span-1 md:col-span-2 border-t border-blue-200 pt-3 mt-2 font-bold text-blue-900">Technical Info</div>
              <div><strong>Device Code:</strong> ${item.device_code || '-'}</div>
              <div><strong>Port on Card:</strong> ${item.port_on_card || '-'}</div>
              <div><strong>Port Splitter:</strong> ${item.port_splitter || '-'}</div>
              <div><strong>Subscriber Node:</strong> ${item.subscriber_node || '-'}</div>
              <div><strong>Cable Length:</strong> ${item.cable_length ? item.cable_length : '-'}</div>
              <div><strong>ONT Serial:</strong> ${item.ont_serial || '-'}</div>
              <div><strong>VMY Code:</strong> ${item.VMY_Code || item.vmy_code || '-'}</div>
              <div><strong>Technician Name:</strong> ${techName}</div>
              <div><strong>Technical Phone:</strong> ${techPhoneHTML}</div>

              <div class="col-span-1 md:col-span-2 border-t border-blue-200 pt-3 mt-2 font-bold text-blue-900">Customer Info</div>
              <div class="col-span-1 md:col-span-2"><strong>Department:</strong> ${item.department || '-'}</div>
              <div class="col-span-1 md:col-span-2"><strong>Address:</strong> ${fullAddress || '-'}</div>
              <div class="col-span-1 md:col-span-2"><strong>Location (Map):</strong> ${mapLinkHTML}</div>
            </div>
          </div>
        `;

        cardsContainer.innerHTML += cardHTML;
      });
    }
  </script>
</body>
</html>
